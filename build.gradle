plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = 'com.cannolicatfish'
base.archivesName = 'rankine'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
        }
        data {
            data()
            // src/generated/resources is BOTH an input and an output here: providers reference
            // models generated earlier in the same tree (e.g. slab models parented to their
            // block model), and ExistingFileHelper resolves those from the committed output.
            programArguments.addAll '--mod', 'rankine', '--all',
                    '--existing', file('src/main/resources').absolutePath,
                    '--existing', file('src/generated/resources').absolutePath,
                    '--output', file('src/generated/resources/').absolutePath
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        rankine {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods.rankine
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    mavenCentral()
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

dependencies {
    compileOnly "mezz.jei:jei-${jei_mc_version}-neoforge-api:${jei_version}"
    // Uncomment to test with JEI in the dev client:
    // localRuntime "mezz.jei:jei-${jei_mc_version}-neoforge:${jei_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// javac stops reporting after 100 errors by default, which hides the tail of a large port.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xmaxerrs' << '3000'
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "rankine",
                "Specification-Vendor"    : "cannolicatfish",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : "cannolicatfish"
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}
