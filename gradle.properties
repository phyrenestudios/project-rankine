# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=false

# NOTE: the Gradle daemon must run on a JDK 21, not a JRE — NeoForm's decompile/recompile
# pipeline calls javax.tools.JavaCompiler in-process and dies with "compiler is null" on a JRE.
# If you hit that error, set org.gradle.java.home to a JDK 21 path in your USER gradle config
# (~/.gradle/gradle.properties), not here: an absolute path committed to this file only works
# on one machine.

mod_version=1.21.1-1.4.0
neo_version=21.1.248
jei_mc_version=1.21.1
jei_version=19.21.0.247
